[tool.poetry]
name = "blueprint"
version = "0.0.2"
description = ""
authors = ["Alissa Huskey <alissa.huskey@gmail.com>"]
readme = "README.md"
packages = [{include = "blueprint"}]
include = [
  { path = "sources", format = ["sdist", "wheel"] },
  # negate ignore settings
  { path = "sources/bare/.*", format = ["sdist", "wheel"] },
  { path = "sources/python/.*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
rich = "^13.7.1"
more-itertools = "^10.2.0"
GitPython = "^3.1.43"
toml = "^0.10.2"
click = "8.1.8"
jsonschema = "^4.25.0"
rich-click = "^1.8.9"
platformdirs = "^4.3.8"
xdg-base-dirs = "*"
pyyaml = "^6.0.2"
referencing = "^0.36.2"
jsonref = "^1.1.0"
jinja2 = "^3.1.6"
frozendict = "^2.4.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
pdbpp = "^0.10.3"
ipython = "^8.22.2"
black = "^24.2.0"
pynvim = "^0.5.0"
pycodestyle = "^2.11.1"
flake8 = "^7.0.0"
flake8-black = "^0.3.6"
flake8-isort = "^6.1.1"
flake8-docstrings = "^1.7.0"
pylama = "^8.4.1"
check-jsonschema = "^0.33.2"
fancycompleter = "0.9.1"
argcomplete = "^3.6.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vvx -m 'not todo'"
markers = ["todo"]

[tool.black]
line-length = "88"

[tool.poetry.scripts]
bp = "blueprint.cli:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
